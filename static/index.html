<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Боня — живой ИИ-помощник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="avatar" id="bonya" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2b3c66"/>
              <stop offset="1" stop-color="#1a2540"/>
            </linearGradient>
            <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#4cc9f0"/>
              <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <line x1="100" y1="26" x2="100" y2="48" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
          <circle cx="100" cy="20" r="8" fill="#4cc9f0"/>
          <circle cx="100" cy="20" r="15" fill="url(#glow)"/>
          <rect x="18" y="86" width="12" height="34" rx="6" fill="#3b82f6"/>
          <rect x="170" y="86" width="12" height="34" rx="6" fill="#3b82f6"/>
          <rect x="28" y="46" width="144" height="122" rx="40" fill="url(#headGrad)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
          <circle class="cheek" cx="56" cy="132" r="9" fill="#8b5cf6" opacity="0.35"/>
          <circle class="cheek" cx="144" cy="132" r="9" fill="#8b5cf6" opacity="0.35"/>
          <g id="eyesNormal">
            <ellipse cx="72" cy="96" rx="17" ry="18" fill="#0b1220"/>
            <ellipse cx="128" cy="96" rx="17" ry="18" fill="#0b1220"/>
            <circle id="pupilL" cx="72" cy="96" r="7.5" fill="#4cc9f0"/>
            <circle id="pupilR" cx="128" cy="96" r="7.5" fill="#4cc9f0"/>
            <circle cx="75" cy="91" r="2.6" fill="#fff" opacity="0.9"/>
            <circle cx="131" cy="91" r="2.6" fill="#fff" opacity="0.9"/>
          </g>
          <g id="eyesHappy" style="display:none">
            <path d="M55 101 Q72 83 89 101" stroke="#4cc9f0" stroke-width="6.5" fill="none" stroke-linecap="round"/>
            <path d="M111 101 Q128 83 145 101" stroke="#4cc9f0" stroke-width="6.5" fill="none" stroke-linecap="round"/>
          </g>
          <rect id="mouth" x="78" y="134" width="44" height="7" rx="3.5" fill="#0b1220"/>
        </svg>
      </div>
      <div class="who">
        <div class="name">Боня</div>
        <div class="status"><span class="dot"></span> онлайн</div>
      </div>
      <button class="icon-btn" id="soundBtn" title="Озвучка">🔊</button>
    </header>

    <main id="messages" class="messages"></main>

    <footer class="composer">
      <div class="composer-row">
        <input id="input" type="text" placeholder="Напиши Боне…" autocomplete="off">
        <button class="send" id="send" title="Отправить">➤</button>
      </div>
      <div class="composer-buttons">
        <button class="icon-btn mic" id="voiceBtn" title="Голос">🎙</button>
        <button class="icon-btn" id="micBtn" title="Сказать голосом">🎤</button>
        <button class="icon-btn" id="singBtn" title="Петь">🎵</button>
        <select id="voiceStyle" class="music-select" title="Голос">
          <option value="bonya">Боня</option>
          <option value="ring">Робот-металл</option>
          <option value="mono">Робот-монотонный</option>
        </select>
        <select id="musicStyle" class="music-select" title="Музыка для пения">
          <option value="none">Без музыки</option>
          <option value="bassbeat">Бас + бит</option>
          <option value="marimba">Маримба</option>
          <option value="rock">Рок</option>
          <option value="jazz">Джаз</option>
          <option value="country">Кантри</option>
          <option value="hiphop">Хип-хоп</option>
          <option value="bit">8-бит</option>
          <option value="ethnic">Этно</option>
          <option value="sad">Грустный</option>
          <option value="disco">Диско</option>
        </select>
      </div>
    </footer>
  </div>

  <div id="login" class="hidden">
    <span class="big">🤖</span>
    <span class="login-title">Боня</span>
    <input id="password" type="password" placeholder="Введи пароль" autocomplete="current-password">
    <button id="loginBtn">Войти</button>
    <div class="err" id="loginErr"></div>
  </div>

  <script src="avatar.js?v=2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
