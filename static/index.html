<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Navigator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #1e2a38;
    --panel: #17212b;
    --bubble-bot: #24313f;
    --bubble-user: #2b5278;
    --text: #e8f0f7;
    --hint: #8aa0b5;
    --accent: #4aa3df;
    --accent-text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(0,0,0,.2);
  }
  .avatar { font-size: 24px; }
  .title { font-weight: 600; flex: 1; }
  select {
    background: var(--bubble-bot);
    color: var(--text);
    border: none;
    border-radius: 10px;
    padding: 8px 8px;
    font-size: 13px;
    outline: none;
    max-width: 130px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; position: relative; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .play {
    display: inline-block;
    margin-top: 6px;
    background: transparent;
    border: none;
    color: var(--hint);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
  }
  footer {
    background: var(--panel);
    padding: 10px;
    display: flex;
    gap: 8px;
    border-top: 1px solid rgba(0,0,0,.2);
  }
  input {
    flex: 1;
    background: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  #send {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: var(--accent-text);
    padding: 0 18px;
    font-size: 18px;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  #login {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; z-index: 10;
  }
  #login.hidden { display: none; }
  #login .big { font-size: 40px; }
  #login input { max-width: 320px; width: 100%; }
  #login button {
    background: var(--accent); border: none; border-radius: 12px;
    color: var(--accent-text); padding: 12px 22px; font-size: 16px; cursor: pointer;
  }
  #login .err { color: #ff6b6b; min-height: 18px; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <span class="avatar">🤖</span>
    <span class="title">Navigator</span>
    <select id="voice">
      <option value="1">железный</option>
      <option value="2">эхо</option>
      <option value="3">космический</option>
      <option value="4">механический</option>
      <option value="5">цифровой</option>
      <option value="6">рация</option>
      <option value="7">женский</option>
      <option value="8">лилипут</option>
    </select>
  </header>
  <div id="messages"></div>
  <footer>
    <input id="input" type="text" placeholder="Напиши сообщение…" autocomplete="off">
    <button id="send">➤</button>
  </footer>
  <div id="login" class="hidden">
    <span class="big">🤖</span>
    <span class="title">Navigator</span>
    <input id="password" type="password" placeholder="Введи пароль" autocomplete="current-password">
    <button id="loginBtn">Войти</button>
    <div class="err" id="loginErr"></div>
  </div>
  <script>
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      var p = tg.themeParams;
      if (p) {
        var r = document.documentElement.style;
        if (p.bg_color) r.setProperty('--bg', p.bg_color);
        if (p.secondary_bg_color) r.setProperty('--panel', p.secondary_bg_color);
        if (p.text_color) r.setProperty('--text', p.text_color);
        if (p.hint_color) r.setProperty('--hint', p.hint_color);
        if (p.button_color) r.setProperty('--accent', p.button_color);
        if (p.button_text_color) r.setProperty('--accent-text', p.button_text_color);
      }
    }
    var messages = document.getElementById('messages');
    var input = document.getElementById('input');
    var send = document.getElementById('send');
    var voiceSelect = document.getElementById('voice');
    var history = [];
    var initData = (tg && tg.initData) ? tg.initData : '';
    var loginEl = document.getElementById('login');
    var passwordEl = document.getElementById('password');
    var loginBtn = document.getElementById('loginBtn');
    var loginErr = document.getElementById('loginErr');

    if (!initData) {
      loginEl.classList.remove('hidden');
    }

    async function doLogin() {
      loginErr.textContent = '';
      try {
        var r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordEl.value })
        });
        if (r.ok) {
          loginEl.classList.add('hidden');
          passwordEl.value = '';
          input.focus();
        } else {
          loginErr.textContent = 'Неверный пароль';
        }
      } catch (e) {
        loginErr.textContent = 'Ошибка сети';
      }
    }
    loginBtn.addEventListener('click', doLogin);
    passwordEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

    function addMessage(text, who) {
      var el = document.createElement('div');
      el.className = 'msg ' + who;
      var span = document.createElement('span');
      span.textContent = text;
      el.appendChild(span);
      if (who === 'bot') {
        var btn = document.createElement('button');
        btn.className = 'play';
        btn.textContent = '🔊';
        btn.addEventListener('click', function () { playVoice(text); });
        el.appendChild(btn);
      }
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    async function playVoice(text) {
      try {
        var resp = await fetch('/api/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Init-Data': initData },
          body: JSON.stringify({ text: text, voice: voiceSelect.value })
        });
        if (!resp.ok) return;
        var blob = await resp.blob();
        var url = URL.createObjectURL(blob);
        var audio = new Audio(url);
        audio.play();
      } catch (e) {}
    }

    async function sendMessage() {
      var text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMessage(text, 'user');
      history.push({ role: 'user', content: text });
      if (history.length > 30) history = history.slice(-30);
      send.disabled = true;
      var pending = addMessage('Думаю…', 'bot');
      try {
        var resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Init-Data': initData },
          body: JSON.stringify({ messages: history })
        });
        var data = await resp.json();
        pending.remove();
        if (data.reply) {
          addMessage(data.reply, 'bot');
          history.push({ role: 'assistant', content: data.reply });
        } else if (resp.status === 403) {
          addMessage('Нет доступа. Открой этот чат через кнопку «💬 Чат» в боте.', 'bot');
        } else {
          addMessage(data.error || 'Ошибка', 'bot');
        }
      } catch (e) {
        pending.remove();
        addMessage('Не удалось связаться с сервером', 'bot');
      }
      send.disabled = false;
      input.focus();
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendMessage(); });

    addMessage('Привет! Я Navigator. Спроси меня о чём-нибудь. 🤖', 'bot');
  </script>
</body>
</html>
